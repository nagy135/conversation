services:
  app:
    build: .
    ports:
      - "127.0.0.1:13005:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      PUBLIC_ORIGIN: https://conversation.infiniter.tech
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
